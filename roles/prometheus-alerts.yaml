groups:
  - name: storage.zfs
    rules:
      - alert: ZfsPoolNotOnline
        expr: node_zfs_zpool_state{state!="online"} == 1
        for: 5m
        labels:
          severity: critical
        annotations:
          summary: "ZFS pool {{ $labels.zpool }} is {{ $labels.state }}"
          description: "Pool {{ $labels.zpool }} on {{ $labels.instance }} has not been online for 5m (state {{ $labels.state }})."

  - name: storage.smart
    rules:
      - alert: SmartStatusFailed
        expr: smartctl_device_smart_status == 0
        for: 5m
        labels:
          severity: critical
        annotations:
          summary: "SMART overall-health failing on {{ $labels.device }}"
          description: "{{ $labels.device }} on {{ $labels.instance }} reports failing SMART health; expect imminent failure."

      - alert: SmartctlExitStatusNonZero
        # smartctl exit status is a bitmask; bits 6 (error log has entries) and 7
        # (selftest log has entries) are historical and routinely set on healthy
        # drives, so mask them out with `% 64` and only alert on the rest.
        expr: (smartctl_device_smartctl_exit_status{job="smartctl"} % 64) > 0
        for: 15m
        labels:
          severity: warning
        annotations:
          summary: "smartctl exit status {{ $value }} on {{ $labels.device }}"
          description: "smartctl reported a current problem (open/command failure, disk failing, prefail attribute at or past threshold); inspect with `smartctl -a {{ $labels.device }}`."

      - alert: SmartctlNoDevices
        expr: absent(smartctl_device_smart_status{job="smartctl"})
        for: 15m
        labels:
          severity: warning
        annotations:
          summary: "smartctl exporter reports no devices"
          description: "The exporter is up but exposes no smartctl_device_* series: smartctl is failing or no disks are visible to the unit."

      # ATA-only attributes; NVMe drives are covered by the Nvme* rules below.
      - alert: ReallocatedSectors
        expr: delta(smartctl_device_attribute{attribute_name="Reallocated_Sector_Ct",attribute_value_type="raw"}[24h]) > 0
        for: 10m
        labels:
          severity: warning
        annotations:
          summary: "New reallocated sectors on {{ $labels.device }}"
          description: "Raw Reallocated_Sector_Ct grew by {{ $value }} in the last 24h; the drive is retiring blocks."

      - alert: PendingSectors
        expr: smartctl_device_attribute{attribute_name="Current_Pending_Sector",attribute_value_type="raw"} > 0
        for: 15m
        labels:
          severity: warning
        annotations:
          summary: "{{ $value }} unstable pending sectors on {{ $labels.device }}"
          description: "Current_Pending_Sector > 0 means blocks could not be read and are awaiting reallocation."

      - alert: SataCrcErrors
        expr: increase(smartctl_device_attribute{attribute_name="UDMA_CRC_Error_Count",attribute_value_type="raw"}[1h]) > 0
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "New SATA link errors on {{ $labels.device }}"
          description: "UDMA_CRC_Error_Count grew by {{ $value }} in 1h, usually a cable/backplane/port problem rather than the disk itself."

      - alert: NvmeMediaErrors
        expr: smartctl_device_media_errors > 0
        for: 15m
        labels:
          severity: critical
        annotations:
          summary: "{{ $value }} uncorrected media errors on {{ $labels.device }}"
          description: "NVMe media_errors > 0 means unrecoverable read/write errors have occurred."

      - alert: NvmeCriticalWarning
        expr: smartctl_device_critical_warning > 0
        for: 5m
        labels:
          severity: critical
        annotations:
          summary: "NVMe critical warning on {{ $labels.device }}"
          description: "Drive raised an NVMe critical warning (spare exhausted, reliability degraded, read-only mode, volatile cache backup failed, or temperature limit)."

      - alert: NvmeWear
        expr: smartctl_device_percentage_used > 90
        for: 1h
        labels:
          severity: warning
        annotations:
          summary: "{{ $labels.device }} is {{ $value }}% through its rated write endurance"
          description: "NVMe percentage_used > 90; plan a replacement."

      - alert: DiskHot
        expr: smartctl_device_temperature{temperature_type="current"} > 50
        for: 15m
        labels:
          severity: warning
        annotations:
          summary: "{{ $labels.device }} at {{ $value }}°C"
          description: "Drive temperature has been above 50°C for 15m; check airflow/fan curves."

  - name: scraping
    rules:
      # Covers every scrape target: node/zfs/smartctl exporters on all hosts,
      # plus the prometheus and alertmanager self-scrapes.
      - alert: ScrapeTargetDown
        expr: up == 0
        for: 10m
        labels:
          severity: warning
        annotations:
          summary: "{{ $labels.job }} target {{ $labels.instance }} is down"
          description: "Prometheus has failed to scrape {{ $labels.instance }} (job {{ $labels.job }}) for 10m."
